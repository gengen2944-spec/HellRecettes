name: Keep Alive - HellRecettes

on:
  schedule:
    - cron: '0 8 * * *'   # Tous les jours à 8h UTC
    - cron: '0 20 * * *'  # Tous les jours à 20h UTC
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest

    steps:
      - name: 1 - Ping Render (réveil du serveur)
        run: |
          echo "→ Ping Render..."
          curl -sf --max-time 60 --retry 3 ${{ secrets.APP_URL }}/ping
          echo " OK"

      - name: 2 - Warmup Supabase (4 requêtes SQL)
        run: |
          echo "→ Warmup Supabase..."
          curl -sf --max-time 60 ${{ secrets.APP_URL }}/warmup
          echo " OK"

      - name: 3 - Pause 10s puis second ping
        run: |
          sleep 10
          echo "→ Second ping..."
          curl -sf --max-time 60 ${{ secrets.APP_URL }}/ping
          echo " OK"
